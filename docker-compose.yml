services:
  mysql:
    image: mysql:8.4
    container_name: app_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      # persistent storage
      - mysql_data:/var/lib/mysql
      
      # automatyczne wykonanie schema przy pierwszym starcie
      - ./db_schema.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
      timeout: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_api
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      
      # dla EF Core + MySQL provider
      ConnectionStrings__Default: >
        server=mysql;
        port=3306;
        database=appdb;
        user=appuser;
        password=apppassword;

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mysql_data: